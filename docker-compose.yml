services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://laplace:${DB_PASSWORD}@db:5432/laplace
      NODE_ENV: production
    volumes:
      - archivos:/app/data/recursos
    depends_on:
      - db
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laplace
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: laplace
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
  archivos:
